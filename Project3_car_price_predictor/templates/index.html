<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction System</title>

    <link rel="stylesheet" href="../static/css/style.css"/>
</head>
<body>
    <main>
        <h1>
            Welcome to Car Price Prediction System
        </h1>

        <div>
            <p>
                This system predicts the price of the car you want to sell. Fill the details below and get started
            </p>

            <form method="post" action="#" accept-charset="UTF-8">
                
                <div>
                    <label for="company">Select the company</label>
                    <select name="company" id="company" required="1">
                        <option value="" disabled selected>Select Company</option>
                        {% for company in companies %}
                        <option value={{company}}>{{ company }}</option>    
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="model">Select the  car model</label>
                    <select name="model" id="model" required="1">
                        <option value="" disabled selected>Select the name of the car model</option> 
                        {% for model in car_models %}
                        <option value={{model}}>{{ model }}</option>    
                        {% endfor %}   
                    </select>
                </div>

                <div>
                    <label for="year">Select the Year of purchase</label>
                    <select name="year" id="year" required="1">
                        <option value="" disabled selected>Select the year of purchase</option>  
                        {% for year in years %}
                        <option value={{year}}>{{ year }}</option>    
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="fuel_type">Select the  Fuel Type used</label>
                    <select name="fuel_type" id="fuel_type" required="1">
                        <option value="" disabled selected>Select the Fuel Type</option> 
                        {% for fuel_type in fuel_types %}
                        <option value={{fuel_type}}>{{ fuel_type }}</option>    
                        {% endfor %}   
                    </select>
                </div>

                <div>
                    <label for="kms_driven">Enter the kilometers driven</label>
                    <input type="text" name="kms_driven" id="kms_driven" placeholder="Enter the kilometers driven" required/>
                </div>

                <div>
                    <button type="submit" onclick=""> Predict the price </button>
                </div>
 
            </form>
        </div>
    </main>

</body>
</html>
