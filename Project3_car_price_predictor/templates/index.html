<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Price Prediction System</title>

    <link rel="stylesheet" href="../static/css/style.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="p-16 mx-auto bg-dark">
    <main class="mx-auto flex flex-col items-center text-black-300 bg-white-200">
        <h1>
            Welcome to Car Price Prediction System
        </h1>

        <div class="p-20 description">
            <p>
                This system predicts the price of the car you want to sell. Fill the details below and get started
            </p>

            <form method="post" action="#" accept-charset="UTF-8" class="p-10 flex flex-col items-center">
                
                <div class="sub-container">
                    <label for="company">Select the company</label>
                    <select name="company" id="company" required="1" onchange="load_car_models(this.id, 'model')"> <!-- car model ko id pathayeko xa -->
                        <option value="" disabled selected>Select Company</option>
                        {% for company in companies %}
                        <option value={{company}}>{{ company }}</option>    
                        {% endfor %}
                    </select>
                </div>

                <div class="sub-container">
                    <label for="model">Select the  car model</label>
                    <select name="model" id="model" required="1">
                        <option id="default_option_for_model" value="" disabled selected>Select the Company First</option> 
                        <!-- {% for model in car_models %}
                        <option value={{model}}>{{ model }}</option>    
                        {% endfor %}    -->
                    </select>
                </div>

                <div class="sub-container">
                    <label for="year">Select the Year of purchase</label>
                    <select name="year" id="year" required="1">
                        <option value="" disabled selected>Select the year of purchase</option>  
                        {% for year in years %}
                        <option value={{year}}>{{ year }}</option>    
                        {% endfor %}
                    </select>
                </div>

                <div class="sub-container">
                    <label for="fuel_type">Select the  Fuel Type used</label>
                    <select name="fuel_type" id="fuel_type" required="1">
                        <option value="" disabled selected>Select the Fuel Type</option> 
                        {% for fuel_type in fuel_types %}
                        <option value={{fuel_type}}>{{ fuel_type }}</option>    
                        {% endfor %}   
                    </select>
                </div>

                <div class="sub-container">
                    <label for="kms_driven">Enter the kilometers driven</label>
                    <input type="text" name="kms_driven" id="kms_driven" placeholder="Enter the kilometers driven" required/>
                </div>

                <div>
                    <button type="submit" onclick=""> Predict the price </button>
                </div>
 
            </form>
        </div>
    </main>

    <script>
        function load_car_models(id, car_model_id)
        {
           var company_element = document.getElementById(id);
           var car_model = document.getElementById(car_model_id);
           var defaultOpt = document.getElementById("default_option_for_model")
           
           defaultOpt.innerHTML="Select the Model Name";
           
           //    console.log(company_element) //returns the entire html element
           //    console.log(company_element.value); // returns the value

           //    the flow: we first  extracts the companies we have in the df, then we check it against the company we selected in the UI. If both are same company, then we extract all the models from the df. We check for the company name in the models. If we have it, we create a newOption with the model name added.
           {% for company in companies %} // jinja bata aayeko

           if (company_element.value == "{{ company }}")
           {
            {% for model in car_models %} // jinja bata aayeko ho
                {% if company in model %}
                    // if the model belongs to the current company, we'll add options

                    var newOption = document.createElement("option");
                    newOption.value='{{ model }}';
                    newOption.innerHTML= '{{ model }}';
                    
                    car_model.options.add(newOption);
                    
                    {% endif %}
                    {% endfor %}
                }
                {% endfor %}

        }
    </script>
</body>
</html>
